name: ERP verification
on:
  push:
    paths: ['**/src/**', '**/pom.xml', 'pom.xml', 'deploy/**', 'test-data/**', 'scripts/**', '.github/workflows/**', '.dockerignore']
  pull_request:
    paths: ['**/src/**', '**/pom.xml', 'pom.xml', 'deploy/**', 'test-data/**', 'scripts/**', '.github/workflows/**', '.dockerignore']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: erp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare isolated local credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import os, secrets
          password = secrets.token_hex(24)
          print('::add-mask::' + password)
          config = {'ERP_ENV':'test','ERP_APP_PORT':'8500','ERP_DB_HOST':'127.0.0.1','ERP_DB_PORT':'45532',
                    'ERP_DB_NAME':'erp','ERP_DB_USER':'erp','ERP_DB_PASSWORD':password,
                    'POSTGRES_DB':'erp','POSTGRES_USER':'erp','POSTGRES_PASSWORD':password,'POSTGRES_HOST_PORT':'45532'}
          with open('.env','w') as f:
              f.write(''.join(k+'='+v+'\n' for k,v in config.items()))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('ERP_IT_DB_PASSWORD='+password+'\n')
          PY
      - name: Start real PostgreSQL
        run: docker compose -f deploy/compose.yaml --env-file .env up -d postgres --wait --wait-timeout 120
      - name: Unit architecture and real database P2P O2C tests
        run: mvn -B clean verify
      - name: Build and start backend within five minutes
        run: |
          docker compose -f deploy/compose.yaml --env-file .env build app
          docker compose -f deploy/compose.yaml --env-file .env up -d --wait --wait-timeout 300
      - name: Repeatable demo data and exact cleanup
        run: |
          test-data/init-test-data.sh
          test-data/init-test-data.sh
          test-data/verify-test-data.sh
          test-data/cleanup-test-data.sh
          test-data/init-test-data.sh
          test-data/verify-test-data.sh
          deploy/smoke.sh
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: erp-test-evidence
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 14
      - name: Remove this ephemeral CI environment
        if: always()
        run: docker compose -f deploy/compose.yaml --env-file .env down --volumes
